services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: avra_viva
      POSTGRES_USER: avra
      POSTGRES_PASSWORD: avra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avra -d avra_viva"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: avra_viva_test
      POSTGRES_USER: avra
      POSTGRES_PASSWORD: avra
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://avra:avra@postgres:5432/avra_viva
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
      - ./data/import:/app/data/import:ro

volumes:
  postgres_data:
  storage_data:
